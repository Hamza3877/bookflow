# Local database only:  docker compose up -d mongo
# Whole app:            docker compose up --build
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports: ["27017:27017"]
    volumes: [mongo_data:/data/db]

  server:
    build: ./server
    depends_on: [mongo]
    ports: ["5000:5000"]
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/bookflow
      JWT_ACCESS_SECRET: change-me-access-secret-123456
      JWT_REFRESH_SECRET: change-me-refresh-secret-123456
      CLIENT_URL: http://localhost:8080

  client:
    build: ./client
    depends_on: [server]
    ports: ["8080:80"]

volumes:
  mongo_data:
